name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "SIGNING_KEYSTORE_BASE64 secret is required for signed release builds" >&2
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/szu-release.jks"
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/szu-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/szu-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Detect version bump
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "changelog_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "changelog_ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Extract this version's release notes
        id: notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.is_new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          version = os.environ["VERSION"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8").replace("\r\n", "\n")
          pattern = re.compile(
              rf"(?ms)^## \[{re.escape(version)}\][^\n]*\n.*?(?=^## \[|\Z)"
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit(f"Failed to extract changelog section for {version}")
          notes = match.group(0).strip() + "\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Name signed APK for release
        id: apk
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.is_new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          DEST="SZU_WLAN_DupConnect-${VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          # Require a verifiable signature on the release APK
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$DEST"

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.is_new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
